<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国社寺 参拝おみくじ＆参拝記録</title>
  <style>
    :root {
      --bg-color: #f7f4ed;
      --card-bg: #ffffff;
      --primary: #c0392b;
      --primary-dark: #962d22;
      --gold: #d4af37;
      --gold-dark: #aa8c2c;
      --text: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #e0dacc;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --success: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      letter-spacing: 2px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h1::before, h1::after {
      content: "⛩️";
      font-size: 1.4rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* タブ切り替え */
    .tab-menu {
      display: flex;
      background: var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 5px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    select {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      background-color: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .candidate-box {
      background: #faf8f5;
      border: 1px dashed var(--gold);
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 20px;
    }

    .candidate-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .candidate-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }

    .candidate-tag {
      font-size: 0.75rem;
      background: #fff;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .candidate-tag.visited {
      background: #e8f8f0;
      border-color: var(--success);
      color: #1e8449;
    }

    .btn-draw {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-draw:active {
      transform: scale(0.98);
    }

    .omikuji-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0 10px;
    }

    .cylinder {
      width: 100px;
      height: 160px;
      background: linear-gradient(90deg, #aa8c2c, #d4af37, #aa8c2c);
      border-radius: 20px 20px 10px 10px;
      box-shadow: inset 0 5px 10px rgba(255,255,255,0.4), inset 0 -5px 10px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #886f20;
    }

    .cylinder-title {
      color: #fff;
      font-weight: bold;
      writing-mode: vertical-rl;
      letter-spacing: 4px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      font-size: 1.1rem;
    }

    .stick {
      width: 18px;
      height: 100px;
      background: #f3e5ab;
      border: 1px solid #c8b88a;
      border-radius: 4px 4px 0 0;
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      z-index: 2;
    }

    .stick.drawn {
      top: -85px;
      opacity: 1;
    }

    .shake {
      animation: shakeAnim 0.6s ease-in-out infinite;
    }

    @keyframes shakeAnim {
      0% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-8deg) translateY(-5px); }
      40% { transform: rotate(8deg) translateY(5px); }
      60% { transform: rotate(-6deg) translateY(-3px); }
      80% { transform: rotate(6deg) translateY(3px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      box-shadow: var(--shadow);
      border: 2px solid var(--gold);
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .result-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-container {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .badge-type {
      background-color: #fce4ec;
      color: #c2185b;
    }

    .badge-pref {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .spot-name {
      font-size: 1.5rem;
      color: var(--primary-dark);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .spot-deity {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      background: #faf8f5;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 2px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-visited {
      width: 100%;
      padding: 12px;
      background-color: var(--success);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .btn-visited.unvisited {
      background-color: #95a5a6;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      background-color: #34495e;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    /* 記録タブの中身 */
    .stats-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 15px;
      text-align: center;
    }

    .stats-num {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin: 5px 0;
    }

    .file-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-file {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      color: var(--text);
    }

    .visited-item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .visited-item {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>全国社寺 参拝おみくじ</h1>
    <p class="subtitle">おみくじを引いて、あなただけの参拝録を作ろう</p>
  </header>

  <div class="container">
    <!-- タブメニュー -->
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('omikuji')">🎍 おみくじを引く</button>
      <button class="tab-btn" onclick="switchTab('records')">📖 参拝記録・ファイル連携</button>
    </div>

    <!-- おみくじタブ -->
    <div id="tab-omikuji" class="tab-content active">
      <div class="control-card">
        <div class="form-group">
          <label for="prefSelect">📍 都道府県を選択</label>
          <select id="prefSelect">
            <option value="all">全国（すべての社寺）</option>
            <option value="北海道">北海道</option>
            <option value="青森県">青森県</option>
            <option value="岩手県">岩手県</option>
            <option value="宮城県">宮城県</option>
            <option value="秋田県">秋田県</option>
            <option value="山形県">山形県</option>
            <option value="福島県">福島県</option>
            <option value="茨城県">茨城県</option>
            <option value="栃木県">栃木県</option>
            <option value="群馬県">群馬県</option>
            <option value="埼玉県">埼玉県</option>
            <option value="千葉県">千葉県</option>
            <option value="東京都">東京都</option>
            <option value="神奈川県">神奈川県</option>
            <option value="新潟県">新潟県</option>
            <option value="富山県">富山県</option>
            <option value="石川県">石川県</option>
            <option value="福井県">福井県</option>
            <option value="山梨県">山梨県</option>
            <option value="長野県">長野県</option>
            <option value="岐阜県">岐阜県</option>
            <option value="静岡県">静岡県</option>
            <option value="愛知県">愛知県</option>
            <option value="三重県">三重県</option>
            <option value="滋賀県">滋賀県</option>
            <option value="京都府">京都府</option>
            <option value="大阪府">大阪府</option>
            <option value="兵庫県">兵庫県</option>
            <option value="奈良県">奈良県</option>
            <option value="和歌山県">和歌山県</option>
            <option value="鳥取県">鳥取県</option>
            <option value="島根県">島根県</option>
            <option value="岡山県">岡山県</option>
            <option value="広島県">広島県</option>
            <option value="山口県">山口県</option>
            <option value="徳島県">徳島県</option>
            <option value="香川県">香川県</option>
            <option value="愛媛県">愛媛県</option>
            <option value="高知県">高知県</option>
            <option value="福岡県">福岡県</option>
            <option value="佐賀県">佐賀県</option>
            <option value="長崎県">長崎県</option>
            <option value="熊本県">熊本県</option>
            <option value="大分県">大分県</option>
            <option value="宮崎県">宮崎県</option>
            <option value="鹿児島県">鹿児島県</option>
            <option value="沖縄県">沖縄県</option>
          </select>
        </div>

        <div class="candidate-box">
          <div class="candidate-header">
            <span>🎯 この条件の出力候補（✅は参拝済み）</span>
            <span id="candidateCountBadge">0件</span>
          </div>
          <div id="candidateList" class="candidate-list"></div>
        </div>

        <div class="omikuji-container">
          <div id="stick" class="stick">一番</div>
          <div id="cylinder" class="cylinder">
            <div class="cylinder-title">奉納おみくじ</div>
          </div>
        </div>

        <button id="drawBtn" class="btn-draw">
          <span>🎍</span> おみくじを振る <span>🎍</span>
        </button>
      </div>

      <!-- 結果カード -->
      <div id="resultCard" class="result-card">
        <div class="badge-container">
          <span id="spotType" class="badge badge-type">神社</span>
          <span id="spotPref" class="badge badge-pref">東京都</span>

        <h2 id="spotName" class="spot-name">明治神宮</h2>
        <div id="spotDeity" class="spot-deity">主祭神：明治天皇・昭憲皇太后</div>

        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">✨ ご利益・祈願</div>
            <div id="spotBenefit" class="info-value">皇室繁栄・世界平和・家内安全・縁結び</div>
          </div>
          <div class="info-item">
            <div class="info-label">⛩️ 参拝可能時間</div>
            <div id="spotWorshipTime" class="info-value">日の出〜日の入り</div>
          </div>
          <div class="info-item">
            <div class="info-label">📜 社務所・授与所 受付時間</div>
            <div id="spotOfficeTime" class="info-value">9:00〜16:30</div>
          </div>
          <div class="info-item">
            <div class="info-label">⭐ 有名度・参拝度</div>
            <div id="spotFame" class="info-value stars">★★★★★</div>
          </div>
        </div>

        <div class="action-buttons">
          <button id="toggleVisitedBtn" class="btn-visited" onclick="toggleCurrentSpotVisited()">
            ✅ 参拝済みにする
          </button>
          <a id="spotUrl" href="#" target="_blank" rel="noopener noreferrer" class="btn-link">
            🌐 公式サイト・詳細情報を見る ↗
          </a>
        </div>
      </div>
    </div>

    <!-- 記録・ファイル連携タブ -->
    <div id="tab-records" class="tab-content">
      <div class="stats-card">
        <div class="info-label">🏆 参拝達成状況</div>
        <div id="statsText" class="stats-num">0 / 0 社寺 (0%)</div>
        <p style="font-size:0.85rem; color:var(--text-muted);">おみくじや候補一覧からチェックインできます</p>

        <!-- iPhoneのファイルアプリ等に書き出し・読み込み -->
        <div class="file-actions">
          <button class="btn-file" onclick="exportDataFile()">💾 記録をファイルに保存</button>
          <button class="btn-file" onclick="document.getElementById('importFile').click()">📁 ファイルから読み込む</button>
          <input type="file" id="importFile" style="display:none" accept=".json" onchange="importDataFile(event)">
        </div>
      </div>

      <div class="control-card">
        <h3 style="font-size: 1rem; color: var(--primary-dark); margin-bottom: 10px;">📜 あなたの参拝済み一覧</h3>
        <div id="visitedItemList" class="visited-item-list">
          <!-- 参拝済みリストがここに入ります -->
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 全国の神社とお寺巡り 参拝おみくじ
  </footer>

  <script>
    // データベース
    const spotsData =
