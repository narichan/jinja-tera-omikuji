<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国社寺 参拝おみくじ</title>
  <style>
    :root {
      --bg-color: #f7f4ed;
      --card-bg: #ffffff;
      --primary: #c0392b;
      --primary-dark: #962d22;
      --gold: #d4af37;
      --gold-dark: #aa8c2c;
      --text: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #e0dacc;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      letter-spacing: 2px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h1::before, h1::after {
      content: "⛩️";
      font-size: 1.4rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    select {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      background-color: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    /* 候補社寺を表示するスペース（おみくじの上） */
    .candidate-box {
      background: #faf8f5;
      border: 1px dashed var(--gold);
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 20px;
    }

    .candidate-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .candidate-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 100px;
      overflow-y: auto;
    }

    .candidate-tag {
      font-size: 0.75rem;
      background: #fff;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--text);
    }

    .btn-draw {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-draw:active {
      transform: scale(0.98);
    }

    .omikuji-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0 10px;
    }

    .cylinder {
      width: 100px;
      height: 160px;
      background: linear-gradient(90deg, #aa8c2c, #d4af37, #aa8c2c);
      border-radius: 20px 20px 10px 10px;
      box-shadow: inset 0 5px 10px rgba(255,255,255,0.4), inset 0 -5px 10px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #886f20;
    }

    .cylinder-title {
      color: #fff;
      font-weight: bold;
      writing-mode: vertical-rl;
      letter-spacing: 4px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      font-size: 1.1rem;
    }

    .stick {
      width: 18px;
      height: 100px;
      background: #f3e5ab;
      border: 1px solid #c8b88a;

      top: -60px;

      align-items: center;
