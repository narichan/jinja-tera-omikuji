<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国社寺 参拝おみくじ</title>
  <style>
    :root {
      --bg-color: #f7f4ed;
      --card-bg: #ffffff;
      --primary: #c0392b;
      --primary-dark: #962d22;
      --gold: #d4af37;
      --gold-dark: #aa8c2c;
      --text: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #e0dacc;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      letter-spacing: 2px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h1::before, h1::after {
      content: "⛩️";
      font-size: 1.4rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    select {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      background-color: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .btn-draw {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-draw:active {
      transform: scale(0.98);
    }

    .omikuji-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0;
    }

    .cylinder {
      width: 100px;
      height: 160px;
      background: linear-gradient(90deg, #aa8c2c, #d4af37, #aa8c2c);
      border-radius: 20px 20px 10px 10px;
      box-shadow: inset 0 5px 10px rgba(255,255,255,0.4), inset 0 -5px 10px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #886f20;
    }

    .cylinder-title {
      color: #fff;
      font-weight: bold;
      writing-mode: vertical-rl;
      letter-spacing: 4px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      font-size: 1.1rem;
    }

    .stick {
      width: 18px;
      height: 100px;
      background: #f3e5ab;
      border: 1px solid #c8b88a;
      border-radius: 4px 4px 0 0;
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      z-index: 2;
    }

    .stick.drawn {
      top: -85px;
      opacity: 1;
    }

    .shake {
      animation: shakeAnim 0.6s ease-in-out infinite;
    }

    @keyframes shakeAnim {
      0% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-8deg) translateY(-5px); }
      40% { transform: rotate(8deg) translateY(5px); }
      60% { transform: rotate(-6deg) translateY(-3px); }
      80% { transform: rotate(6deg) translateY(3px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      box-shadow: var(--shadow);
      border: 2px solid var(--gold);
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .result-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-container {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .badge-type {
      background-color: #fce4ec;
      color: #c2185b;
    }

    .badge-pref {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .spot-name {
      font-size: 1.5rem;
      color: var(--primary-dark);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .spot-deity {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      background: #faf8f5;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 2px;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      background-color: #34495e;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-link:hover {
      background-color: #2c3e50;
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>

        setTimeout(() => {
          // 社寺の抽出
          const selectedPref = prefSelect.value;
          let filteredSpots = spotsData;

          if (selectedPref !== 'all') {
            filteredSpots = spotsData.filter(s => s.pref === selectedPref);
          }

          // データが無い場合の対応
          if (filteredSpots.length === 0) {
            filteredSpots = spotsData; // 全体からフォールバック
          }

          const spot = filteredSpots[Math.floor(Math.random() * filteredSpots.length)];

          // 結果を表示
          spotType.textContent = spot.type;
          spotPref.textContent = spot.pref;
          spotName.textContent = spot.name;
          spotDeity.textContent = `主祭神/本尊：`;
          spotBenefit.textContent = spot.benefit;
          spotWorshipTime.textContent = spot.worshipTime;
          spotOfficeTime.textContent = spot.officeTime;
          spotFame.textContent = "★".repeat(spot.fame) + "☆".repeat(5 - spot.fame);
          spotUrl.href = spot.url;

          resultCard.classList.add('active');
          isDrawing = false;
        }, 500);

      }, 800);
    });
  </script>
</body>
</html>
